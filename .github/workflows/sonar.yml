name: SonarQube Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build + test coverage (lcov)
        run: |
          npm run typecheck
          npm test -- --coverage
          test -f coverage/lcov.info || (echo "lcov missing" && exit 1)

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        if: github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        if: github.actor != 'dependabot[bot]'
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Dump failing gate conditions (debug)
        if: failure()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          PULL_NR="${{ github.event.pull_request.number }}"
          KEY=hendro17_brewassist_638d026b-d0f1-4d52-850c-dc4600813732
          curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=$KEY&pullRequest=$PULL_NR" | python3 -m json.tool | head -60
          echo "=== NEW ISSUES ==="
          curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/issues/search?componentKeys=$KEY&pullRequest=$PULL_NR&inNewCodePeriod=true&ps=20&facets=rules" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(i['rule'], '|', i['component'].split('/')[-1], '|', i['message'][:120]) for i in d.get('issues',[])]"
          echo "=== LOWEST NEW COVERAGE FILES ==="
          curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/measures/component_tree?component=$KEY&pullRequest=$PULL_NR&metricKeys=coverage&ps=30" | python3 -c "
import json,sys
d=json.load(sys.stdin)
rows=[(c.get('path','?'), next((m.get('value','?') for m in c.get('measures',[]) if m.get('metric')=='coverage'), '?')) for c in d.get('components',[])]
rows.sort(key=lambda r: float(r[1]) if r[1]!='?' else 999)
[print(f'{v:>6}  {p}') for p,v in rows[:15]]
"
